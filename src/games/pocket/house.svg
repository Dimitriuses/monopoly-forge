<!--
  Drawn for this repo, by hand, in an editor. It exists to prove that a game can
  bring its own artwork (`Game.assets`) without the project carrying anybody
  else's — see docs/authoring-a-game.md.

  20×18 to match the baked house it replaces, so nothing downstream rescales.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="18" viewBox="0 0 20 18">
  <path d="M0 6 L10 0 L20 6 Z" fill="#2f6f5f"/>
  <rect x="2" y="6" width="16" height="12" fill="#3f8f79"/>
  <rect x="7" y="10" width="6" height="8" fill="#1d4a3e"/>
</svg>
