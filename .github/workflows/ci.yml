name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Typecheck, unit tests and a production build, on both a Linux and a Windows
  # runner — the project is developed on Windows and deployed from Linux, so the
  # contrast is worth proving rather than assuming.
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Printed before the install so a future `npm ci` failure is diagnosable
      # from the log alone — the npm major that consumes the lockfile is exactly
      # what broke this workflow once before. See tools/verify-install.mjs.
      - name: Toolchain versions
        run: node --version && npm --version

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # Boots the built game in a real browser, plays 30 seeded turns and fails on
  # any console error, page exception or inconsistent game state. "It works" as
  # a check rather than a claim.
  playtest:
    name: playtest (headless chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Printed before the install so a future `npm ci` failure is diagnosable
      # from the log alone — the npm major that consumes the lockfile is exactly
      # what broke this workflow once before. See tools/verify-install.mjs.
      - name: Toolchain versions
        run: node --version && npm --version

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Play 30 turns
        run: npm run playtest
